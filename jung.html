<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="한글 기초를 마친 어르신을 위한 받아쓰기 중급 과정 - 낱말 쓰기 4단계, 문장 쓰기 3단계. 성우 음성으로 들려 드립니다.">
<meta name="theme-color" content="#14646E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="한글뚝딱(중급)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<!-- 중급만 따로 홈 화면에 담을 수 있게. 초급과 start_url 이 달라 별개 앱으로 깔립니다.
     아이콘은 tools/dictation/make_icons_jung.py 가 만듭니다 (주황 바탕에 「중급」). -->
<link rel="manifest" href="manifest-jung.webmanifest">
<link rel="apple-touch-icon" href="icon-jung-180.png">
<title>한글뚝딱(중급)</title>
<style>
  :root {
    --bg: #FBF7EF; --card: #FFFFFF; --ink: #26221B; --sub: #6B6353;
    --accent: #14646E; --accent-ink: #FFFFFF; --accent-soft: #E3F0F1;
    --warm: #A65A28; --warm-soft: #FAEDE1;
    --good: #2E7D32; --good-soft: #E6F3E6; --bad: #C4472B; --bad-soft: #FBEAE5;
    --line: #E4DCCB; --paper: #FFFDF6;
    --shadow: 0 2px 8px rgba(60, 50, 30, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #201D18; --card: #2C2822; --ink: #F2EDE2; --sub: #B5AC9A;
      --accent: #6FC3CE; --accent-ink: #10343A; --accent-soft: #1E3A3E;
      --warm: #E2A273; --warm-soft: #3A2A1E;
      --good: #7FC983; --good-soft: #253A26; --bad: #E8896F; --bad-soft: #3F2620;
      --line: #45403A; --paper: #322D26;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #201D18; --card: #2C2822; --ink: #F2EDE2; --sub: #B5AC9A;
    --accent: #6FC3CE; --accent-ink: #10343A; --accent-soft: #1E3A3E;
    --warm: #E2A273; --warm-soft: #3A2A1E;
    --good: #7FC983; --good-soft: #253A26; --bad: #E8896F; --bad-soft: #3F2620;
    --line: #45403A; --paper: #322D26;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html { font-size: 22px; }
  html[data-size="big"] { font-size: 26px; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", sans-serif;
    line-height: 1.5; -webkit-text-size-adjust: 100%;
  }
  main { max-width: 520px; margin: 0 auto; padding-block: 0.7rem 2.6rem; padding-left: 0.7rem; padding-right: 0.7rem; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; padding: 0.6rem 0.2rem 0.5rem; }
  header h1 { font-size: 1.35rem; margin: 0; }
  .top-tools { display: flex; gap: 0.4rem; }
  .tool-btn {
    font-size: 0.88rem; font-weight: 700; padding: 0.45rem 0.75rem; border-radius: 14px;
    border: 3px solid var(--accent); background: var(--card); color: var(--accent);
  }
  .screen { display: none; }
  .screen.active { display: block; }

  .greeting { background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 1rem 1.1rem; margin-bottom: 1rem; box-shadow: var(--shadow); }
  .greeting p { margin: 0; font-size: 1.02rem; line-height: 1.6; }
  .greeting strong { color: var(--accent); }
  .greeting a { color: var(--accent); font-weight: 800; }

  .part-title { font-size: 1.1rem; font-weight: 800; margin: 1.2rem 0 0.6rem; display: flex; align-items: center; gap: 0.5rem; }
  .part-title span.n { background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 0.1rem 0.7rem; font-size: 0.9rem; }
  .menu { display: flex; flex-direction: column; gap: 0.7rem; }
  .menu-btn {
    display: flex; align-items: center; gap: 0.9rem; text-align: left; width: 100%;
    background: var(--card); color: var(--ink); border: 1px solid var(--line);
    border-left: 12px solid var(--accent); border-radius: 18px; padding: 0.95rem 1rem; box-shadow: var(--shadow);
  }
  .menu-btn:hover { background: var(--accent-soft); }
  .menu-btn.warm { border-left-color: var(--warm); }
  .menu-btn .icon { font-size: 2rem; line-height: 1; }
  .menu-btn .mid { flex: 1; }
  .menu-btn .label { font-size: 1.15rem; font-weight: 800; display: block; }
  .menu-btn .desc { font-size: 0.85rem; color: var(--sub); display: block; margin-top: 0.15rem; line-height: 1.45; }
  .stamp { font-size: 1.3rem; width: 2.2rem; text-align: center; line-height: 1.15; }
  .stamp .score { display: block; font-size: 0.65rem; font-weight: 800; color: var(--good); }

  .tool-card {
    display: flex; align-items: center; gap: 0.8rem; width: 100%; text-align: left;
    background: var(--warm-soft); border: 3px solid var(--warm); border-radius: 18px;
    padding: 0.9rem 1rem; margin-top: 1.2rem; color: var(--ink); text-decoration: none;
  }
  .tool-card:hover { background: var(--card); }
  /* 다음 과정(고급)으로 넘어가는 칸. 연습 도구(겹받침)와 색을 달리해 구별합니다. */
  .tool-card.next { background: var(--accent-soft); border-color: var(--accent); }
  .tool-card + .tool-card { margin-top: 0.6rem; }
  .tool-card .icon { font-size: 1.9rem; }
  .tool-card .label { font-size: 1.1rem; font-weight: 800; display: block; }
  .tool-card .desc { font-size: 0.85rem; color: var(--sub); display: block; margin-top: 0.1rem; }

  .section-title { font-size: 1.2rem; font-weight: 800; margin: 0.6rem 0 0.3rem; }
  .hint { font-size: 0.92rem; color: var(--sub); margin: 0.2rem 0 0.8rem; line-height: 1.55; }
  .progress { font-size: 0.95rem; font-weight: 700; color: var(--accent); margin: 0 0 0.6rem; font-variant-numeric: tabular-nums; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 20px;
    padding: 1rem 0.85rem; box-shadow: var(--shadow); }

  /* ===== 3부 · 짧은 글 읽기 =====
     글은 또박또박 크게. 어르신이 한 줄씩 눈으로 따라갈 수 있게 줄 사이를 넉넉히 둡니다. */
  .read-name { font-size: 1rem; font-weight: 800; color: var(--sub); margin: 0 0 0.5rem; }
  .read-box {
    background: var(--bg); border: 2px solid var(--line); border-radius: 14px;
    padding: 1rem 0.9rem; margin-bottom: 0.9rem;
  }
  .read-box p {
    font-size: 1.28rem; line-height: 1.85; margin: 0 0 0.45rem; word-break: keep-all;
  }
  .read-box p:last-child { margin-bottom: 0; }
  /* 숫자는 눈으로 읽어 내는 것이 배울 거리라 또렷하게 보여 줍니다 */
  .read-box .num { font-weight: 900; color: var(--warm); }
  .read-ask {
    font-size: 1.18rem; font-weight: 800; line-height: 1.6;
    margin: 1rem 0 0.7rem; word-break: keep-all;
  }
  .read-choices { display: flex; flex-direction: column; gap: 0.55rem; }
  .read-choices button {
    font-size: 1.15rem; font-weight: 700; text-align: left; line-height: 1.5;
    padding: 0.95rem 1rem; border-radius: 14px;
    border: 2px solid var(--line); background: var(--card); color: var(--ink);
    word-break: keep-all;
  }
  .read-choices button .mark { font-weight: 900; margin-right: 0.45rem; color: var(--sub); }
  .read-choices button.pick { border-color: var(--accent); background: var(--accent-soft); }
  .read-choices button.ok { border-color: var(--good); background: var(--good-soft); }
  .read-choices button.ng { border-color: var(--bad); background: var(--bad-soft); }
  .read-choices button[disabled] { opacity: 1; }

  .listen-row { display: flex; gap: 0.5rem; }
  /* display:flex 가 hidden 을 덮어써서, 감춰야 할 때도 단추가 보였습니다.
     2부(문장)와 3부(읽기) 둘 다 해당합니다. */
  .listen-row[hidden] { display: none; }
  .listen-btn {
    flex: 2; font-size: 1.2rem; font-weight: 800; padding: 1rem 0.8rem; border-radius: 16px;
    border: 3px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  }
  .slow-btn {
    flex: 1; font-size: 0.98rem; font-weight: 800; padding: 1rem 0.5rem; border-radius: 16px;
    border: 3px solid var(--accent); background: var(--card); color: var(--accent);
  }
  .no-audio { font-size: 0.92rem; color: var(--sub); background: var(--bg); border: 2px dashed var(--line);
    border-radius: 14px; padding: 0.6rem 0.8rem; margin: 0 0 0.6rem; line-height: 1.5; }

  /* 원고지 칸 */
  .slots { display: flex; gap: 0.4rem; justify-content: center; flex-wrap: wrap; margin: 1rem 0 0.6rem; }
  .slot {
    width: 3rem; height: 3.4rem; border: 3px solid var(--line); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; font-weight: 900; background: var(--paper); color: var(--ink);
  }
  .slot.cur { border-color: var(--accent); background: var(--accent-soft); }
  .slot.ok { border-color: var(--good); color: var(--good); }
  .slot.no { border-color: var(--bad); color: var(--bad); }
  .slot.gap { width: 0.9rem; border: none; background: none; }

  .build-now { text-align: center; font-size: 1.05rem; font-weight: 800; color: var(--accent); margin: 0.2rem 0 0.5rem; }
  .build-now .pv { font-size: 1.6rem; color: var(--ink); }
  .pal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0.35rem; }
  .pal button {
    font-size: 1.3rem; font-weight: 800; padding: 0.55rem 0.1rem; border-radius: 12px;
    border: 2px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .pal button:hover { border-color: var(--accent); background: var(--accent-soft); }
  .pal button.wide { grid-column: span 3; font-size: 1rem; }
  .pal button.miss { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }

  /* 낱말·글자 카드 고르기 */
  .tokens { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-top: 0.8rem; }
  .token {
    font-size: 1.3rem; font-weight: 800; padding: 0.6rem 0.9rem; border-radius: 14px;
    border: 3px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .token:hover { border-color: var(--accent); background: var(--accent-soft); }
  .token.used { opacity: 0.35; }
  .line-slots { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; min-height: 3.4rem;
    background: var(--paper); border: 3px dashed var(--line); border-radius: 14px; padding: 0.5rem; }
  .lslot {
    min-width: 3rem; padding: 0.4rem 0.7rem; border-radius: 10px; border: 2px solid var(--line);
    background: var(--card); font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; justify-content: center;
  }
  .lslot.empty { color: var(--sub); border-style: dashed; }
  .lslot.ok { border-color: var(--good); color: var(--good); background: var(--good-soft); }
  .lslot.no { border-color: var(--bad); color: var(--bad); background: var(--bad-soft); }
  .word-listen {
    font-size: 0.95rem; font-weight: 800; padding: 0.35rem 0.7rem; border-radius: 999px;
    border: 2px solid var(--accent); background: var(--card); color: var(--accent);
  }
  .word-listen-row { display: flex; flex-wrap: wrap; gap: 0.4rem; justify-content: center; margin-top: 0.6rem; }

  .btn-row { display: flex; gap: 0.5rem; margin-top: 0.8rem; flex-wrap: wrap; }
  .btn-row > * { flex: 1 1 7rem; }
  .nav-btn { font-size: 1rem; font-weight: 800; padding: 0.75rem 0.6rem; border-radius: 16px;
    border: 3px solid var(--accent); background: var(--card); color: var(--accent); }
  .nav-btn.primary { background: var(--accent); color: var(--accent-ink); }
  .nav-btn.quiet { border-color: var(--line); color: var(--sub); }
  .nav-btn:disabled { opacity: 0.4; }
  .wide { flex: 1 1 100%; }

  .feedback { font-size: 1.02rem; font-weight: 700; margin: 0.8rem 0 0; line-height: 1.6;
    border-radius: 14px; padding: 0.75rem 0.85rem; display: none; word-break: keep-all; }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--good-soft); color: var(--good); }
  .feedback.ng { background: var(--bad-soft); color: var(--bad); }
  /* 정답은 안내 문장 색을 따라가지 않고, 흰 쪽지 위 먹색으로 또렷하게 */
  .feedback b { font-weight: 900; color: var(--ink); background: var(--card);
    border-radius: 8px; padding: 0.06em 0.4em; }

  .mode-row { display: flex; gap: 0.4rem; margin-bottom: 0.7rem; }
  .mode-btn { flex: 1; font-size: 0.92rem; font-weight: 800; padding: 0.55rem 0.3rem; border-radius: 999px;
    border: 3px solid var(--accent); background: var(--card); color: var(--accent); }
  .mode-btn.on { background: var(--accent); color: var(--accent-ink); }

  .result { text-align: center; background: var(--card); border: 1px solid var(--line);
    border-radius: 20px; padding: 1.3rem 1rem; box-shadow: var(--shadow); }
  .result .trophy { font-size: 3rem; line-height: 1; }
  .result h2 { font-size: 1.35rem; margin: 0.4rem 0 0.3rem; }
  .result p { font-size: 1rem; color: var(--sub); margin: 0 0 0.9rem; line-height: 1.6; }
  .wrong-list { text-align: left; background: var(--bg); border-radius: 14px; padding: 0.7rem 0.9rem;
    margin: 0 0 0.9rem; font-size: 1rem; line-height: 1.8; }
  .wrong-list b { font-weight: 900; color: var(--ink); }

  .notice { position: fixed; left: 0.7rem; right: 0.7rem; bottom: 0.9rem; max-width: 500px; margin: 0 auto;
    background: var(--bad-soft); color: var(--bad); border: 3px solid var(--bad); border-radius: 16px;
    padding: 0.9rem 1rem; font-size: 1rem; font-weight: 700; line-height: 1.5;
    box-shadow: var(--shadow); z-index: 60; display: none; white-space: pre-line; }
  .notice.show { display: block; }

  @media (max-width: 360px) { html { font-size: 20px; } .slot { width: 2.6rem; height: 3rem; font-size: 1.7rem; } }
  @media (prefers-reduced-motion: no-preference) {
    .screen.active { animation: fadein 0.25s ease; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .shake { animation: shake 0.3s; }
    @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  }
</style>

<main>
  <header>
    <h1>📝 한글뚝딱(중급)</h1>
    <div class="top-tools">
      <button class="tool-btn" id="btnSize">🔍 글자 크게</button>
      <button class="tool-btn" id="btnHome" hidden>🏠 처음으로</button>
    </div>
  </header>

  <section class="screen active" id="scr-home">
    <div class="greeting">
      <p><strong>기초를 마치신 분들의 받아쓰기 반입니다.</strong><br>
      성우가 읽어 주는 말을 듣고 <strong>낱말</strong>과 <strong>문장</strong>을 직접 써 봅니다.
      종이에 쓰셔도 되고, 화면에서 <strong>글자를 만들어</strong> 쓰셔도 됩니다.</p>
      <p style="margin-top:0.6rem"><a href="index.html">← 🌱 한글뚝딱(초급)으로 돌아가기</a></p>
    </div>

    <h2 class="part-title"><span class="n">1부</span> 낱말 쓰기</h2>
    <div class="menu" id="menuWord"></div>

    <h2 class="part-title"><span class="n">2부</span> 문장 쓰기</h2>
    <div class="menu" id="menuSent"></div>

    <h2 class="part-title"><span class="n">3부</span> 짧은 글 읽고 이해하기</h2>
    <div class="menu" id="menuRead"></div>

    <a class="tool-card" href="gyeopbatchim.html">
      <span class="icon">🧩</span>
      <span><span class="label">겹받침 쓰기 연습</span>
      <span class="desc">닭 · 값 · 많다 … 받침이 두 개인 글자만 따로 익히기</span></span>
      <span style="font-size:1.3rem;color:var(--warm)">▶</span>
    </a>

    <!-- 다음 과정. 고급은 go/ 폴더의 따로 선 앱이라 주소로 넘어갑니다. -->
    <a class="tool-card next" href="go/">
      <span class="icon">📘</span>
      <span><span class="label">한글뚝딱(고급)으로 가기</span>
      <span class="desc">중급을 마치셨으면 — 관공서 말, 서식 채워 쓰기, 편지 쓰기</span></span>
      <span style="font-size:1.3rem;color:var(--accent)">▶</span>
    </a>
  </section>

  <!-- 낱말 받아쓰기 -->
  <section class="screen" id="scr-word">
    <h2 class="section-title" id="wTitle"></h2>
    <p class="hint" id="wTip"></p>
    <p class="progress" id="wProgress"></p>
    <div class="panel">
      <div class="mode-row">
        <button class="mode-btn on" id="mdBuild">🔡 글자 만들어 쓰기</button>
        <button class="mode-btn" id="mdPaper">✍️ 종이에 쓰기</button>
      </div>
      <div class="listen-row">
        <button class="listen-btn" id="wListen">🔊 다시 듣기</button>
        <button class="slow-btn" id="wSlow">🔁 한 번 더</button>
      </div>
      <div class="slots" id="wSlots"></div>
      <div id="wBuild">
        <p class="build-now" id="wStep"></p>
        <div class="pal" id="wPal"></div>
      </div>
      <p class="feedback" id="wFeedback"></p>
      <div class="btn-row" id="wBtns"></div>
    </div>
  </section>

  <!-- 문장 쓰기 -->
  <section class="screen" id="scr-sent">
    <h2 class="section-title" id="sTitle"></h2>
    <p class="hint" id="sTip"></p>
    <p class="progress" id="sProgress"></p>
    <div class="panel">
      <div class="listen-row" id="sListenRow">
        <button class="listen-btn" id="sListen">🔊 다시 듣기</button>
        <button class="slow-btn" id="sSlow">🔁 한 번 더</button>
      </div>
      <p class="no-audio" id="sNoAudio" hidden></p>
      <div class="word-listen-row" id="sWordRow"></div>
      <div class="line-slots" id="sSlots"></div>
      <div class="tokens" id="sTokens"></div>
      <p class="feedback" id="sFeedback"></p>
      <div class="btn-row" id="sBtns"></div>
    </div>
  </section>

  <!-- 결과 -->
  <!-- 3부 · 짧은 글 읽고 이해하기 -->
  <section class="screen" id="scr-read">
    <h2 class="section-title" id="rdTitle"></h2>
    <p class="hint" id="rdTip"></p>
    <p class="progress" id="rdProgress"></p>
    <div class="panel">
      <p class="read-name" id="rdName"></p>
      <div class="read-box" id="rdBox"></div>
      <div class="listen-row" id="rdListenRow">
        <button class="listen-btn" id="rdListen">🔊 글 다시 듣기</button>
      </div>
      <p class="no-audio" id="rdNoAudio" hidden></p>
      <p class="read-ask" id="rdAsk"></p>
      <div class="read-choices" id="rdChoices"></div>
      <p class="feedback" id="rdFeedback"></p>
      <div class="btn-row" id="rdBtns"></div>
    </div>
  </section>

  <section class="screen" id="scr-result">
    <div class="result">
      <div class="trophy" id="rTrophy">🏆</div>
      <h2 id="rTitle"></h2>
      <p id="rDesc"></p>
      <div class="wrong-list" id="rWrong" hidden></div>
      <div class="btn-row">
        <button class="nav-btn primary wide" id="rAgain">🔄 한 번 더 하기</button>
        <button class="nav-btn wide" id="rHome">🏠 처음으로</button>
      </div>
    </div>
  </section>

  <div class="notice" id="notice" role="status" aria-live="polite"></div>

/* 아이폰·안드로이드는 화면을 누른 직후가 아니면 소리를 막는다.
   첫 터치 때 소리 없는 짧은 소리를 한 번 재생해 두면 그 뒤로는 자유롭게 들려줄 수 있다. */
var SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';
var unlocked = false;
function unlockAudio() {
  if (unlocked) return;
  unlocked = true;
  try {
    player.muted = true;
    setSrc(SILENT);
    var p = player.play();
    var done = function () { try { player.pause(); player.currentTime = 0; } catch (e) {} player.muted = false; };
    if (p && p.then) p.then(done).catch(done); else done();
  } catch (e) { player.muted = false; }
}
document.addEventListener('pointerdown', unlockAudio, { capture: true, once: true });
document.addEventListener('touchstart', unlockAudio, { capture: true, once: true });
document.addEventListener('click', unlockAudio, { capture: true, once: true });

var noticeTimer = null, lastNotice = 0;
function showNotice(msg) {
  var el = document.getElementById('notice'), now = Date.now();
  if (!el || now - lastNotice < 4000) return;
  lastNotice = now;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(function () { el.classList.remove('show'); }, 7000);
}
function onPlayFail() {
  if (navigator.onLine === false) {
    showNotice('이 소리는 아직 받지 못했어요.\n와이파이에 연결한 뒤 한글뚝딱(초급) 첫 화면에서\n「소리 모두 받기」를 눌러 주세요.');
  } else {
    showNotice('소리를 불러오지 못했습니다.\n잠시 뒤 다시 눌러 주세요.');
  }
}
player.addEventListener('error', onPlayFail);

function advanceStep() {
  var st = stepQueue.shift();
  if (!st) return;
  stepTimer = setTimeout(function () {
    setSrc(st.src);
    player.play().catch(onPlayFail);
  }, st.delay || 0);
}
player.addEventListener('ended', advanceStep);

function playSteps(steps) {
  stopAll();
  stepQueue = steps.slice();
  advanceStep();
}
function stopAll() {
  stepQueue = [];
  clearTimeout(stepTimer);
  try { player.pause(); } catch (e) {}
}

/* 낱말·문장 → 소리 파일. 녹음이 없으면 null (꾸며 낸 목소리는 쓰지 않습니다) */
function fileOf(text) {
  if (!text) return null;
  if (DATA.SENT_AUDIO && DATA.SENT_AUDIO[text]) return DATA.SENT_AUDIO[text];
  if (DATA.READ_AUDIO && DATA.READ_AUDIO[text]) return DATA.READ_AUDIO[text];
  return DATA.A[text] || null;
}

/* 다음에 들려줄 소리를 미리 받아 둡니다. 소리 자체는 건드리지 않습니다. */
function warm(list) {
  if (!list) return;
  if (typeof list === 'string') list = [list];
  list.forEach(function (t) { var f = fileOf(t); if (f) warmSrc([f]); });
}
function warmSrc(srcs) {
  if (!window.fetch) return;
  (srcs || []).filter(Boolean).forEach(function (s) {
    if (sliceFor(s)) return;                    /* 묶음에 이미 있으니 받을 것이 없습니다 */
    fetch(s).catch(function () {});
  });
}

/* slow 가 참이면 빠르기는 그대로 두고 한 번 더 들려줍니다.
   (배속을 늦추면 목소리가 뭉개져 기계음처럼 들립니다) */
function play(text, slow) {
  var list = (typeof text === 'string') ? [text] : (text || []);
  var srcs = list.map(fileOf).filter(Boolean);
  if (!srcs.length) return false;
  var steps = srcs.map(function (s, i) { return { src: s, delay: i ? 0 : 0 }; });
  if (slow) {
    steps = steps.concat(srcs.map(function (s, i) { return { src: s, delay: i ? 0 : 700 }; }));
  }
  playSteps(steps);
  return true;
}
function playFx(key, then) {
  var steps = [];
  if (DATA.FX[key]) steps.push({ src: DATA.FX[key] });
  var g = fileOf(then);
  if (g) steps.push({ src: g });
  if (steps.length) playSteps(steps);
}
function playSrcs(srcs) {
  var steps = (srcs || []).filter(Boolean).map(function (s) { return { src: s }; });
  if (steps.length) playSteps(steps);
}

/* ============ 한글 글자 만들기 ============ */
var CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
var JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
var JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function parts(ch) {
  var c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return null;
  return [Math.floor(c / 588), Math.floor((c % 588) / 28), c % 28];
}
function compose(a, b, c) { return String.fromCharCode(0xAC00 + (a * 21 + b) * 28 + (c || 0)); }

/* 소리가 같아 헷갈리는 글자 만들기 (보기 카드용) */
var SAME_JONG = [[19,20,22,23,25,7],[1,2,24],[17,26],[4],[8],[16],[21]];
var SAME_JUNG = [[1,5],[3,7],[10,11,15],[9,14]];
function confuse(syl) {
  var p = parts(syl); if (!p) return [];
  var out = [];
  SAME_JONG.forEach(function (g) {
    if (g.indexOf(p[2]) !== -1) g.forEach(function (j) { if (j !== p[2]) out.push(compose(p[0], p[1], j)); });
  });
  SAME_JUNG.forEach(function (g) {
    if (g.indexOf(p[1]) !== -1) g.forEach(function (v) { if (v !== p[1]) out.push(compose(p[0], v, p[2])); });
  });
  if (p[0] === 18) out.push(compose(11, p[1], p[2]));          // ㅎ → ㅇ (소리가 약해집니다)
  if (p[2] !== 0) out.push(compose(p[0], p[1], 0));            // 받침 빠뜨리기
  return out;
}

/* ============ 기록 ============ */
var STORE = 'hangul-dict:progress';
var prog = {};
try { prog = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) { prog = {}; }
function saveScore(id, right, total) {
  var cur = prog[id];
  if (!cur || right >= cur.best) prog[id] = { best: right, total: total };
  try { localStorage.setItem(STORE, JSON.stringify(prog)); } catch (e) {}
}
function stampOf(id) {
  var p = prog[id];
  if (!p) return '<span class="stamp" style="color:var(--line)">○</span>';
  if (p.best / p.total >= 0.8) return '<span class="stamp">✅<span class="score">' + p.best + '/' + p.total + '</span></span>';
  return '<span class="stamp">🔁<span class="score" style="color:var(--sub)">' + p.best + '/' + p.total + '</span></span>';
}

try { if (localStorage.getItem('hangul-dict:size') === 'big') document.documentElement.dataset.size = 'big'; } catch (e) {}
function syncSize() { $('btnSize').textContent = document.documentElement.dataset.size === 'big' ? '🔍 글자 작게' : '🔍 글자 크게'; }
$('btnSize').addEventListener('click', function () {
  var big = document.documentElement.dataset.size === 'big';
  if (big) delete document.documentElement.dataset.size; else document.documentElement.dataset.size = 'big';
  try { localStorage.setItem('hangul-dict:size', big ? 'normal' : 'big'); } catch (e) {}
  syncSize();
});

  var list = document.querySelectorAll('.screen');
  for (var i = 0; i < list.length; i++) list[i].classList.toggle('active', list[i].id === 'scr-' + id);
  $('btnHome').hidden = (id === 'home');
  window.scrollTo(0, 0);
}
$('btnHome').addEventListener('click', function () { go('home'); renderHome(); });

var SENT_STAGES = [
  { id: 's1', icon: '💬', title: '1단계 · 짧은 인사말', unit: 'syl',
    tip: '성우가 읽어 주는 인사말을 듣고, 글자 카드를 차례대로 골라 채웁니다.', pool: DATA.S1 },
  { id: 's2', icon: '🗨️', title: '2단계 · 띄어 쓰는 인사말', unit: 'word',
    tip: '낱말 카드를 골라 문장을 만듭니다. 어디서 띄어 쓰는지도 함께 익힙니다.', pool: DATA.S2 },
  { id: 's3', icon: '📃', title: '3단계 · 생활 문장 쓰기', unit: 'given',
    tip: '소리 나는 대로 쓴 말과 바르게 쓴 말을 가려 문장을 만듭니다. 낱말 소리는 들어 보실 수 있습니다.', pool: DATA.S3 }
];

function pick(arr, n) {
  var c = arr.slice();
  for (var i = c.length - 1; i > 0; i--) { var k = Math.floor(Math.random() * (i + 1)); var t = c[i]; c[i] = c[k]; c[k] = t; }
  return c.slice(0, Math.min(n, c.length));
}

/* ============ 1부 · 낱말 받아쓰기 ============ */
var W = null;
var paperMode = false;
try { paperMode = localStorage.getItem('hangul-dict:paper') === '1'; } catch (e) {}

function startWord(si) {
  var st = DATA.W[si];
  W = { st: st, items: pick(st.words, 10), i: 0, right: 0, wrong: [], slot: 0, step: 0, cur: [0, 0, 0], miss: false, done: false };
  go('word');
  renderWord(true);
}

function setMode(paper) {
  paperMode = paper;
  try { localStorage.setItem('hangul-dict:paper', paper ? '1' : '0'); } catch (e) {}
  $('mdBuild').classList.toggle('on', !paper);
  $('mdPaper').classList.toggle('on', paper);
  if (W) renderWord(false);
}
$('mdBuild').addEventListener('click', function () { setMode(false); });
$('mdPaper').addEventListener('click', function () { setMode(true); });

function renderWord(playIt) {
  var it = W.items[W.i];
  $('mdBuild').classList.toggle('on', !paperMode);
  $('mdPaper').classList.toggle('on', paperMode);
  $('wTitle').textContent = W.st.icon + ' ' + W.st.title;
  $('wTip').textContent = W.st.tip;
  $('wProgress').textContent = (W.i + 1) + ' / ' + W.items.length + ' · 맞힌 낱말 ' + W.right + '개';
  var slots = '';
  for (var i = 0; i < it.length; i++) {
    var filled = W.done ? it[i] : (i < W.slot ? it[i] : (i === W.slot && !paperMode ? preview() : ''));
    var cls = 'slot' + (W.done ? ' ok' : (i === W.slot && !paperMode ? ' cur' : ''));
    slots += '<span class="' + cls + '">' + (paperMode && !W.done ? '' : filled) + '</span>';
  }
  $('wSlots').innerHTML = slots;
  $('wBuild').hidden = paperMode || W.done;
  if (!paperMode && !W.done) renderPal();
  $('wFeedback').className = 'feedback';
  $('wFeedback').innerHTML = '';
  renderWordBtns();
  if (playIt) play(it);
  warm(W.items[W.i + 1]);
}

function preview() {
  if (W.step === 0) return '';
  if (W.step === 1) return CHO[W.cur[0]];
  return compose(W.cur[0], W.cur[1], 0);
}

function renderPal() {
  var labels = ['① 첫소리를 고르세요', '② 가운뎃소리를 고르세요', '③ 받침을 고르세요'];
  var pv = W.step === 0 ? '' : (W.step === 1 ? CHO[W.cur[0]] : compose(W.cur[0], W.cur[1], 0));
  $('wStep').innerHTML = labels[W.step] + (pv ? ' <span class="pv">' + pv + '</span>' : '');
  var list = W.step === 0 ? CHO : (W.step === 1 ? JUNG : JONG);
  var h = '';
  for (var i = 0; i < list.length; i++) {
    if (W.step === 2 && i === 0) h += '<button class="wide" data-i="0">받침 없음</button>';
    else h += '<button data-i="' + i + '">' + list[i] + '</button>';
  }
  $('wPal').innerHTML = h;
  var bs = $('wPal').querySelectorAll('button');
  for (var k = 0; k < bs.length; k++) bs[k].addEventListener('click', onPal);
}

function onPal() {
  var it = W.items[W.i];
  var want = parts(it[W.slot]);
  var got = +this.dataset.i;
  if (want && got !== want[W.step]) {
    this.classList.add('miss', 'shake');
    W.miss = true;
    var names = ['첫소리', '가운뎃소리', '받침'];
    var fb = $('wFeedback');
    fb.className = 'feedback show ng';
    fb.innerHTML = names[W.step] + '가 다릅니다. 다시 한 번 들어 보세요.';
    play(it);
    return;
  }
  W.cur[W.step] = got;
  $('wFeedback').className = 'feedback';
  if (W.step < 2) { W.step++; renderWord(false); return; }
  W.slot++; W.step = 0; W.cur = [0, 0, 0];
  if (W.slot < it.length) { renderWord(false); return; }
  finishWord(!W.miss);
}

function finishWord(clean) {
  W.done = true;
  if (clean) W.right++; else if (W.wrong.indexOf(W.items[W.i]) === -1) W.wrong.push(W.items[W.i]);
  renderWord(false);
  var fb = $('wFeedback');
  fb.className = 'feedback show ' + (clean ? 'ok' : 'ng');
  fb.innerHTML = clean ? '⭕ 잘 쓰셨습니다! <b>' + W.items[W.i] + '</b>' : '바르게 쓴 글자는 <b>' + W.items[W.i] + '</b> 입니다.';
  if (clean) playFx('praise'); else playFx('wrong', W.items[W.i]);
}

function renderWordBtns() {
  var h = '';
  if (W.done) {
    h = '<button class="nav-btn primary wide" id="wNext">' + (W.i === W.items.length - 1 ? '🏆 결과 보기' : '➡️ 다음 낱말') + '</button>';
  } else if (paperMode) {
    h = '<button class="nav-btn primary wide" id="wShow">👀 종이에 쓰셨으면 정답 보기</button>';
  } else {
    h = '<button class="nav-btn quiet" id="wUndo">🧹 지우기</button>' +
        '<button class="nav-btn" id="wGiveUp">🤷 모르겠어요</button>';
  }
  $('wBtns').innerHTML = h;
  if ($('wNext')) $('wNext').addEventListener('click', nextWord);
  if ($('wShow')) $('wShow').addEventListener('click', showPaperAnswer);
  if ($('wUndo')) $('wUndo').addEventListener('click', undoWord);
  if ($('wGiveUp')) $('wGiveUp').addEventListener('click', function () { W.miss = true; finishWord(false); });
}

function showPaperAnswer() {
  W.done = true;
  renderWord(false);
  var fb = $('wFeedback');
  fb.className = 'feedback show ok';
  fb.innerHTML = '바르게 쓴 글자는 <b>' + W.items[W.i] + '</b> 입니다. 쓰신 것과 맞춰 보세요.';
  $('wBtns').innerHTML =
    '<button class="nav-btn" id="pOk">⭕ 맞았어요</button>' +
    '<button class="nav-btn" id="pNo">❌ 틀렸어요</button>';
  $('pOk').addEventListener('click', function () { W.right++; nextWord(); });
  $('pNo').addEventListener('click', function () { W.wrong.push(W.items[W.i]); nextWord(); });
  play(W.items[W.i]);
}

function undoWord() {
  if (W.step > 0) { W.step--; }
  else if (W.slot > 0) { W.slot--; W.step = 2; var p = parts(W.items[W.i][W.slot]); W.cur = p ? [p[0], p[1], 0] : [0, 0, 0]; }
  renderWord(false);
}

function nextWord() {
  if (W.i === W.items.length - 1) { finishStage(W.st.id, W.right, W.items.length, W.wrong, function () { startWord(DATA.W.indexOf(W.st)); }); return; }
  W.i++; W.slot = 0; W.step = 0; W.cur = [0, 0, 0]; W.miss = false; W.done = false;
  renderWord(true);
}

$('wListen').addEventListener('click', function () { play(W.items[W.i]); });
$('wSlow').addEventListener('click', function () { play(W.items[W.i], true); });

/* ============ 2부 · 문장 쓰기 ============ */
var S = null;

function startSent(si) {
  var st = SENT_STAGES[si];
  var items = pick(st.pool, 10).map(function (raw) {
    if (st.unit === 'given') {
      return { text: raw.map(function (p) { return p[0]; }).join(' '),
               toks: raw.map(function (p) { return p[0]; }),
               words: raw.map(function (p) { return p[1]; }),
               bad: raw.map(function (p) { return p[2]; }).filter(Boolean) };
    }
    if (st.unit === 'word') {
      var ws = raw.split(' ');
      return { text: raw, toks: ws, words: [raw], bad: [] };
    }
    return { text: raw, toks: raw.split(''), words: [raw], bad: [] };
  });
  var fillers = [];
  items.forEach(function (x) { x.toks.forEach(function (t) { if (fillers.indexOf(t) === -1) fillers.push(t); }); });
  S = { st: st, si: si, items: items, i: 0, right: 0, wrong: [], filled: [], done: false, fillers: fillers };
  go('sent');
  renderSent(true);
}

function sentTokens(it) {
  var bad = it.bad.slice();
  if (!bad.length) {
    it.toks.forEach(function (t) {
      if (bad.length >= 4) return;
      var v = (t.length === 1) ? confuse(t) : confuse(t[t.length - 1]).map(function (c) { return t.slice(0, -1) + c; });
      for (var i = 0; i < v.length && bad.length < 4; i++) {
        if (it.toks.indexOf(v[i]) === -1 && bad.indexOf(v[i]) === -1) bad.push(v[i]);
      }
    });
  }
  /* 보기가 너무 적으면 같은 단계의 다른 말에서 카드를 몇 장 더 섞는다 */
  if (bad.length < 3 && S && S.fillers) {
    var extra = S.fillers.filter(function (t) { return it.toks.indexOf(t) === -1 && bad.indexOf(t) === -1; });
    for (var i = extra.length - 1; i > 0; i--) { var k = Math.floor(Math.random() * (i + 1)); var t2 = extra[i]; extra[i] = extra[k]; extra[k] = t2; }
    bad = bad.concat(extra.slice(0, 3 - bad.length));
  }
  var all = it.toks.concat(bad);
  for (var i = all.length - 1; i > 0; i--) { var k = Math.floor(Math.random() * (i + 1)); var t = all[i]; all[i] = all[k]; all[k] = t; }
  return all;
}

function renderSent(playIt) {
  var it = S.items[S.i];
  if (!it.cards) it.cards = sentTokens(it);
  $('sTitle').textContent = S.st.icon + ' ' + S.st.title;
  $('sTip').textContent = S.st.tip;
  $('sProgress').textContent = (S.i + 1) + ' / ' + S.items.length + ' · 맞힌 문장 ' + S.right + '개';

  var whole = fileOf(it.text);
  $('sListenRow').hidden = !whole;
  $('sNoAudio').hidden = !!whole;
  if (!whole) $('sNoAudio').innerHTML = '이 문장은 아직 성우 녹음이 없습니다. 아래 <b>낱말 소리</b>를 눌러 들으시고, 문장을 만들어 보세요.';

  var wr = '';
  it.words.forEach(function (w) { if (w && fileOf(w)) wr += '<button class="word-listen" data-w="' + w + '">🔊 ' + w + '</button>'; });
  $('sWordRow').innerHTML = whole ? '' : wr;
  var wbs = $('sWordRow').querySelectorAll('.word-listen');
  for (var i = 0; i < wbs.length; i++) wbs[i].addEventListener('click', function () { play(this.dataset.w); });

  var sl = '';
  for (var k = 0; k < it.toks.length; k++) {
    var v = S.filled[k];
    var cls = 'lslot' + (v == null ? ' empty' : '') + (S.done ? (v === it.toks[k] ? ' ok' : ' no') : '');
    sl += '<button class="' + cls + '" data-k="' + k + '">' + (v == null ? '　' : v) + '</button>';
  }
  $('sSlots').innerHTML = sl;
  var sbs = $('sSlots').querySelectorAll('.lslot');
  for (var m = 0; m < sbs.length; m++) sbs[m].addEventListener('click', function () {
    if (S.done) return;
    S.filled[+this.dataset.k] = null;
    renderSent(false);
  });

  $('sTokens').innerHTML = S.done ? '' : it.cards.map(function (c, ci) {
    var used = S.filled.indexOf(c) !== -1;
    return '<button class="token' + (used ? ' used' : '') + '" data-c="' + ci + '"' + (used ? ' disabled' : '') + '>' + c + '</button>';
  }).join('');
  var tbs = $('sTokens').querySelectorAll('.token');
  for (var n = 0; n < tbs.length; n++) tbs[n].addEventListener('click', function () {
    var c = it.cards[+this.dataset.c];
    for (var j = 0; j < it.toks.length; j++) { if (S.filled[j] == null) { S.filled[j] = c; break; } }
    renderSent(false);
  });

  $('sFeedback').className = 'feedback';
  $('sFeedback').innerHTML = '';
  renderSentBtns();
  if (playIt && whole) play(it.text);
  if (S.items[S.i + 1]) warm(S.items[S.i + 1].text);
}

function renderSentBtns() {
  var h;
  if (S.done) h = '<button class="nav-btn primary wide" id="sNext">' + (S.i === S.items.length - 1 ? '🏆 결과 보기' : '➡️ 다음 문장') + '</button>';
  else h = '<button class="nav-btn quiet" id="sClear">🧹 다 지우기</button>' +
           '<button class="nav-btn primary" id="sCheck">✅ 다 됐어요</button>';
  $('sBtns').innerHTML = h;
  if ($('sNext')) $('sNext').addEventListener('click', nextSent);
  if ($('sClear')) $('sClear').addEventListener('click', function () { S.filled = []; renderSent(false); });
  if ($('sCheck')) $('sCheck').addEventListener('click', checkSent);
}

function checkSent() {
  var it = S.items[S.i];
  for (var i = 0; i < it.toks.length; i++) if (S.filled[i] == null) {
    var f = $('sFeedback'); f.className = 'feedback show ng';
    f.innerHTML = '빈 칸이 남아 있습니다. 카드를 모두 채워 주세요.';
    return;
  }
  var ok = it.toks.every(function (t, k) { return S.filled[k] === t; });
  S.done = true;
  if (ok) S.right++; else S.wrong.push(it.text);
  renderSent(false);
  var fb = $('sFeedback');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'ng');
  fb.innerHTML = (ok ? '⭕ 잘 쓰셨습니다!' : '바르게 쓴 문장은 이렇습니다.') +
    '<br><b>' + it.text + '</b>' +
    (S.st.unit === 'word' ? '<br>띄어 쓰는 자리도 함께 보세요.' : '') +
    '<br>종이에도 한 번 써 보시면 더 잘 외워집니다.';
  if (ok) playFx('praise'); else playFx('wrong', it.text);
}

function nextSent() {
  if (S.i === S.items.length - 1) { finishStage(S.st.id, S.right, S.items.length, S.wrong, function () { startSent(S.si); }); return; }
  S.i++; S.filled = []; S.done = false;
  renderSent(true);
}

$('sListen').addEventListener('click', function () { play(S.items[S.i].text); });
$('sSlow').addEventListener('click', function () { play(S.items[S.i].text, true); });

/* ============ 결과 ============ */

/* ============ 3부 · 짧은 글 읽고 이해하기 ============
   받아쓰기와 달리 「읽고 고르기」입니다. 글을 한 줄씩 들려 드리고,
   묻는 말과 보기도 모두 소리로 읽어 드립니다. 글을 못 읽는 분도
   듣고 고를 수 있어야 하기 때문입니다.
   숫자 단계(showOnly)는 일부러 글을 읽어 주지 않습니다 —
   숫자를 눈으로 읽어 내는 것이 그 단계의 배울 거리입니다. */
/* 글에 꺾쇠나 & 가 섞여도 화면이 깨지지 않게. 지금 자료에는 없지만,
   나중에 글을 더할 때 안전하도록 둡니다. */
function esc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

var RD = null;

/* 줄 자료는 '글' 이거나 ['보이는 글', '읽어 줄 말'] 입니다 */
function rdShown(line) { return Array.isArray(line) ? line[0] : line; }
function rdSaid(line) { return Array.isArray(line) ? line[1] : line; }

/* 숫자·금액·시각을 또렷하게 (보이기만 바꿉니다. 글자는 그대로입니다) */
function rdMarkNums(t) {
  return esc(t).replace(/[0-9][0-9,]*/g, function (m) { return '<span class="num">' + m + '</span>'; });
}

function startRead(si) {
  var st = DATA.R[si];
  /* 글 차례는 섞지 않습니다. 쉬운 것부터 짜 두었기 때문입니다. */
  var items = [];
  st.texts.forEach(function (t, ti) {
    t.q.forEach(function (q, qi) { items.push({ t: t, ti: ti, q: q, first: qi === 0 }); });
  });
  RD = { st: st, items: items, i: 0, right: 0, wrong: [], done: false, picked: -1 };
  go('read');
  renderRead(true);
}

function renderRead(withSound) {
  var it = RD.items[RD.i], t = it.t, q = it.q;
  $('rdTitle').textContent = RD.st.title;
  $('rdTip').textContent = RD.st.tip;
  $('rdProgress').textContent = '물음 ' + (RD.i + 1) + ' / ' + RD.items.length +
    ' · 맞힌 물음 ' + RD.right + '개';
  $('rdName').textContent = t.title;
  $('rdBox').innerHTML = t.lines.map(function (l) {
    return '<p>' + rdMarkNums(rdShown(l)) + '</p>';
  }).join('');

  /* 글 듣기 단추 — 숫자 단계이거나 녹음이 없으면 감춥니다 */
  var says = t.showOnly ? [] : t.lines.map(rdSaid).filter(function (x) { return fileOf(x); });
  var canHear = says.length > 0;
  $('rdListenRow').hidden = !canHear;
  $('rdNoAudio').hidden = !(t.showOnly);
  if (t.showOnly) $('rdNoAudio').textContent = '이 단계는 숫자를 눈으로 읽어 보는 곳입니다. 물음과 보기는 들려 드립니다.';

  $('rdAsk').textContent = q[0];
  RD.picked = -1;
  RD.done = false;
  var marks = ['①', '②', '③', '④'];
  $('rdChoices').innerHTML = q[1].map(function (c, k) {
    return '<button type="button" data-k="' + k + '"><span class="mark">' + marks[k] + '</span>' + esc(c) + '</button>';
  }).join('');
  var bs = $('rdChoices').querySelectorAll('button');
  for (var k = 0; k < bs.length; k++) {
    bs[k].addEventListener('click', function () { pickRead(+this.dataset.k); });
  }
  var fb = $('rdFeedback'); fb.className = 'feedback'; fb.innerHTML = '';
  $('rdBtns').innerHTML = '';

  if (withSound) {
    /* 글 → 묻는 말 차례로 들려 드립니다 */
    play(says.concat([q[0]]));
  }
}

function pickRead(k) {
  if (RD.done) return;
  var it = RD.items[RD.i], q = it.q;
  RD.picked = k;
  RD.done = true;
  var ok = (k === q[2]);
  if (ok) RD.right++; else RD.wrong.push(q[0]);

  var bs = $('rdChoices').querySelectorAll('button');
  for (var i = 0; i < bs.length; i++) {
    bs[i].disabled = true;
    if (i === q[2]) bs[i].classList.add('ok');
    else if (i === k) bs[i].classList.add('ng');
  }
  var fb = $('rdFeedback');
  fb.className = 'feedback show ' + (ok ? 'ok' : 'ng');
  fb.innerHTML = ok ? '⭕ 맞았습니다!' : '바른 답은 <b>' + esc(q[1][q[2]]) + '</b> 입니다.';

  var last = (RD.i === RD.items.length - 1);
  $('rdBtns').innerHTML = '<button class="nav-btn primary wide" id="rdNext">' +
    (last ? '🏆 결과 보기' : '➡️ 다음 물음') + '</button>';
  $('rdNext').addEventListener('click', nextRead);

  playFx(ok ? 'praise' : 'wrong', ok ? null : q[1][q[2]]);
}

function nextRead() {
  if (RD.i < RD.items.length - 1) {
    RD.i++;
    /* 같은 글의 두 번째 물음이면 글은 다시 안 읽어 드립니다 */
    renderRead(RD.items[RD.i].first);
    return;
  }
  finishRead();
}

function finishRead() {
  var st = RD.st;
  saveScore(st.id, RD.right, RD.items.length);
  againFn = function () { startRead(DATA.R.indexOf(st)); };
  go('result');
  var ratio = RD.right / RD.items.length;
  var trophy = '🌱', title = '천천히 한 번 더 읽어 볼까요?', grade = 'ok';
  if (ratio === 1) { trophy = '🏆'; title = '만점입니다!'; grade = 'perfect'; }
  else if (ratio >= 0.7) { trophy = '🎉'; title = '아주 잘 읽으셨어요!'; grade = 'good'; }
  $('rTrophy').textContent = trophy;
  $('rTitle').textContent = title;
  $('rDesc').textContent = RD.items.length + '개 물음 가운데 ' + RD.right + '개를 맞히셨습니다.';
  if (RD.wrong.length) {
    $('rWrong').hidden = false;
    $('rWrong').innerHTML = '한 번 더 읽어 보실 물음<br>' +
      RD.wrong.map(function (w) { return '<b>' + esc(w) + '</b>'; }).join('<br>');
  } else { $('rWrong').hidden = true; }
  playSrcs([DATA.SC[RD.right] || null, DATA.FX[grade]]);
}

$('rdListen').addEventListener('click', function () {
  var t = RD.items[RD.i].t;
  if (t.showOnly) return;
  play(t.lines.map(rdSaid));
});

var againFn = null;
function finishStage(id, right, total, wrong, again) {
  saveScore(id, right, total);
  againFn = again;
  go('result');
  var ratio = right / total;
  var trophy = '🌱', title = '천천히 한 번 더 해 볼까요?', grade = 'ok';
  if (ratio === 1) { trophy = '🏆'; title = '만점입니다!'; grade = 'perfect'; }
  else if (ratio >= 0.7) { trophy = '🎉'; title = '아주 잘하셨어요!'; grade = 'good'; }
  $('rTrophy').textContent = trophy;
  $('rTitle').textContent = title;
  $('rDesc').textContent = total + '개 가운데 ' + right + '개를 바르게 쓰셨습니다.';
  if (wrong && wrong.length) {
    $('rWrong').hidden = false;
    $('rWrong').innerHTML = '한 번 더 써 보실 말<br>' + wrong.map(function (w) { return '<b>' + w + '</b>'; }).join(' · ');
  } else { $('rWrong').hidden = true; }
  playSrcs([DATA.SC[right], DATA.FX[grade]]);
}
$('rAgain').addEventListener('click', function () { if (againFn) againFn(); });
$('rHome').addEventListener('click', function () { go('home'); renderHome(); });

/* ============ 시작 ============ */
renderHome();
warmSrc([DATA.FX.praise, DATA.FX.wrong], true);
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  navigator.serviceWorker.register('sw.js').catch(function () {});
}
</script>
